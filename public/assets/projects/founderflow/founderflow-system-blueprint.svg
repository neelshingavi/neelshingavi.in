<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="ff-grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#100e0a" />
      <stop offset="100%" stop-color="#18140c" />
    </linearGradient>
    <pattern id="ff-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(244, 240, 223, 0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="800" height="480" fill="url(#ff-grad-bg)" rx="12" />
  <rect width="800" height="480" fill="url(#ff-grid)" rx="12" />
  <rect width="798" height="478" x="1" y="1" fill="none" stroke="rgba(251, 192, 45, 0.3)" stroke-width="1" rx="11" />

  <!-- Header -->
  <rect x="0" y="0" width="800" height="40" fill="rgba(244, 240, 223, 0.03)" rx="12" />
  <circle cx="24" cy="20" r="4.5" fill="#ff5e3a" opacity="0.8" />
  <circle cx="40" cy="20" r="4.5" fill="#e1b92f" opacity="0.8" />
  <circle cx="56" cy="20" r="4.5" fill="#bff205" opacity="0.8" />
  <text x="80" y="24" fill="#aaa28a" font-family="'JetBrains Mono', monospace" font-size="11">FOUNDERFLOW // EARLY-STAGE STARTUP OPERATING SYSTEM</text>
  <rect x="635" y="10" width="145" height="20" rx="4" fill="rgba(251, 192, 45, 0.15)" />
  <text x="707" y="24" fill="#fbc02d" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle" font-weight="700">FOUNDER SYSTEM</text>

  <!-- 3 Modular Blocks -->
  <g transform="translate(40, 70)">
    <rect width="210" height="150" rx="8" fill="#1b170e" stroke="rgba(251, 192, 45, 0.4)" stroke-width="1.2" />
    <rect x="0" y="0" width="210" height="32" rx="8" fill="rgba(251, 192, 45, 0.1)" />
    <text x="14" y="21" fill="#fbc02d" font-family="'Bricolage Grotesque', sans-serif" font-weight="700" font-size="13">Idea Validation</text>
    <text x="14" y="52" fill="#aaa28a" font-family="'JetBrains Mono', monospace" font-size="10">Heuristic Scoring Engine</text>
    <text x="14" y="74" fill="#f4f0df" font-family="'Bricolage Grotesque', sans-serif" font-size="12">• Market sizing evaluation</text>
    <text x="14" y="94" fill="#f4f0df" font-family="'Bricolage Grotesque', sans-serif" font-size="12">• Competitor moat mapping</text>
    <text x="14" y="114" fill="#f4f0df" font-family="'Bricolage Grotesque', sans-serif" font-size="12">• Customer interview logging</text>
    <rect x="14" y="126" width="182" height="16" rx="3" fill="rgba(251, 192, 45, 0.12)" />
    <text x="105" y="138" fill="#fbc02d" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">VALIDATION SCORECARD</text>
  </g>

  <path d="M 250 145 L 295 145" fill="none" stroke="#fbc02d" stroke-width="2" stroke-dasharray="3 3" />

  <g transform="translate(295, 70)">
    <rect width="210" height="150" rx="8" fill="#1b170e" stroke="rgba(191, 242, 5, 0.4)" stroke-width="1.2" />
    <rect x="0" y="0" width="210" height="32" rx="8" fill="rgba(191, 242, 5, 0.1)" />
    <text x="14" y="21" fill="#bff205" font-family="'Bricolage Grotesque', sans-serif" font-weight="700" font-size="13">Roadmap Pipelines</text>
    <text x="14" y="52" fill="#aaa28a" font-family="'JetBrains Mono', monospace" font-size="10">Agile Sprint Execution</text>
    <text x="14" y="74" fill="#f4f0df" font-family="'Bricolage Grotesque', sans-serif" font-size="12">• Milestone Gantt charting</text>
    <text x="14" y="94" fill="#f4f0df" font-family="'Bricolage Grotesque', sans-serif" font-size="12">• Dynamic feature dependency</text>
    <text x="14" y="114" fill="#f4f0df" font-family="'Bricolage Grotesque', sans-serif" font-size="12">• Automated sprint health</text>
    <rect x="14" y="126" width="182" height="16" rx="3" fill="rgba(191, 242, 5, 0.12)" />
    <text x="105" y="138" fill="#bff205" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">EXECUTION TIMELINES</text>
  </g>

  <path d="M 505 145 L 550 145" fill="none" stroke="#bff205" stroke-width="2" stroke-dasharray="3 3" />

  <g transform="translate(550, 70)">
    <rect width="210" height="150" rx="8" fill="#1b170e" stroke="rgba(255, 94, 58, 0.4)" stroke-width="1.2" />
    <rect x="0" y="0" width="210" height="32" rx="8" fill="rgba(255, 94, 58, 0.1)" />
    <text x="14" y="21" fill="#ff5e3a" font-family="'Bricolage Grotesque', sans-serif" font-weight="700" font-size="13">Founder Dashboard</text>
    <text x="14" y="52" fill="#aaa28a" font-family="'JetBrains Mono', monospace" font-size="10">Centralized Cockpit</text>
    <text x="14" y="74" fill="#f4f0df" font-family="'Bricolage Grotesque', sans-serif" font-size="12">• Real-time runway monitor</text>
    <text x="14" y="94" fill="#f4f0df" font-family="'Bricolage Grotesque', sans-serif" font-size="12">• Investor update generator</text>
    <text x="14" y="114" fill="#f4f0df" font-family="'Bricolage Grotesque', sans-serif" font-size="12">• Cross-functional sync</text>
    <rect x="14" y="126" width="182" height="16" rx="3" fill="rgba(255, 94, 58, 0.12)" />
    <text x="105" y="138" fill="#ff5e3a" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">METRICS AGGREGATION</text>
