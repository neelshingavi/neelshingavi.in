  <!-- Spec Lower Panel -->
  <g transform="translate(40, 240)">
    <rect width="720" height="160" rx="8" fill="#110e08" stroke="rgba(244, 240, 223, 0.1)" stroke-width="1" />
    <rect x="0" y="0" width="720" height="32" rx="8" fill="#19150d" />
    <text x="16" y="21" fill="#aaa28a" font-family="'JetBrains Mono', monospace" font-size="10">OPERATING SYSTEM BLUEPRINT // DESIGNED FOR FAST-PACED STARTUP TEAMS</text>
    <text x="20" y="60" fill="#fbc02d" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">FOUNDER WORKFLOW SYNCHRONIZATION:</text>
    <text x="20" y="84" fill="#f4f0df" font-family="'JetBrains Mono', monospace" font-size="10.5">• Unifies fragmented tools (Notion docs, Trello boards, and spreadsheet budgets) into one cohesive interface.</text>
    <text x="20" y="104" fill="#f4f0df" font-family="'JetBrains Mono', monospace" font-size="10.5">• Provides single-source-of-truth sprint tracking with automatic velocity calculations.</text>
    <text x="20" y="124" fill="#bff205" font-family="'JetBrains Mono', monospace" font-size="10.5">• Exportable pitch-ready progress digests for mentors, incubators, and university review boards.</text>
  </g>

  <!-- Footer -->
  <g transform="translate(40, 420)">
    <rect width="720" height="38" rx="6" fill="rgba(244, 240, 223, 0.02)" stroke="rgba(244, 240, 223, 0.08)" stroke-width="1" />
    <text x="20" y="24" fill="#aaa28a" font-family="'JetBrains Mono', monospace" font-size="11">DOMAIN:</text>
    <text x="80" y="24" fill="#fbc02d" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">Startup Operations &amp; Incubator Systems</text>
    <text x="390" y="24" fill="#aaa28a" font-family="'JetBrains Mono', monospace" font-size="11">ROLE:</text>
    <text x="440" y="24" fill="#bff205" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">End-to-End Product Architecture</text>
