<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="qp-grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090e0c" />
      <stop offset="100%" stop-color="#0f1614" />
    </linearGradient>
    <pattern id="qp-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(244, 240, 223, 0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="480" fill="url(#qp-grad-bg)" rx="12" />
  <rect width="800" height="480" fill="url(#qp-grid)" rx="12" />
  <rect width="798" height="478" x="1" y="1" fill="none" stroke="rgba(0, 229, 255, 0.2)" stroke-width="1" rx="11" />

  <!-- Window Header Bar -->
  <rect x="0" y="0" width="800" height="40" fill="rgba(244, 240, 223, 0.03)" rx="12" />
  <circle cx="24" cy="20" r="4.5" fill="#ff5e3a" opacity="0.8" />
  <circle cx="40" cy="20" r="4.5" fill="#e1b92f" opacity="0.8" />
  <circle cx="56" cy="20" r="4.5" fill="#bff205" opacity="0.8" />
  <text x="80" y="24" fill="#aaa28a" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="0.5">QUERYPILOT // NL-TO-SQL ANALYTICAL PIPELINE (IIT BOMBAY INSIGHTX)</text>
  <rect x="630" y="10" width="150" height="20" rx="4" fill="rgba(0, 229, 255, 0.12)" stroke="rgba(0, 229, 255, 0.3)" stroke-width="1" />
  <text x="705" y="24" fill="#00e5ff" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle" font-weight="700">250K+ UPI RECORDS</text>

  <!-- Pipeline Horizontal Flow: 3 Step Process Top, Execution Console Bottom -->
  <!-- STEP 1: CONVERSATIONAL QUERY INPUT -->
  <g transform="translate(36, 60)">
    <rect width="215" height="120" rx="8" fill="#121816" stroke="rgba(0, 229, 255, 0.3)" stroke-width="1.2" />
    <rect x="0" y="0" width="215" height="28" rx="8" fill="rgba(0, 229, 255, 0.08)" />
    <text x="12" y="19" fill="#00e5ff" font-family="'Bricolage Grotesque', sans-serif" font-weight="700" font-size="12">1. Natural Language Input</text>
    <rect x="12" y="38" width="191" height="42" rx="4" fill="#0a0e0c" stroke="rgba(244, 240, 223, 0.1)" stroke-width="1" />
    <text x="18" y="54" fill="#bff205" font-family="'JetBrains Mono', monospace" font-size="9.5">"Show merchant volume</text>
    <text x="18" y="70" fill="#bff205" font-family="'JetBrains Mono', monospace" font-size="9.5">&amp; latency for electronics"</text>
    <text x="12" y="98" fill="#aaa28a" font-family="'JetBrains Mono', monospace" font-size="9">Input normalization &amp; context</text>
  </g>

  <!-- CONNECTOR 1 -> 2 -->
  <path d="M 251 120 L 285 120" fill="none" stroke="#00e5ff" stroke-width="2" stroke-dasharray="3 3" />
  <polygon points="285,120 277,115 277,125" fill="#00e5ff" />

  <!-- STEP 2: LANGCHAIN INFERENCE & SAFETY GATE -->
  <g transform="translate(285, 60)">
    <rect width="230" height="120" rx="8" fill="#121816" stroke="rgba(191, 242, 5, 0.4)" stroke-width="1.2" />
    <rect x="0" y="0" width="230" height="28" rx="8" fill="rgba(191, 242, 5, 0.08)" />
    <text x="12" y="19" fill="#bff205" font-family="'Bricolage Grotesque', sans-serif" font-weight="700" font-size="12">2. LLM Reasoning &amp; Safety Gate</text>
    <text x="12" y="48" fill="#f4f0df" font-family="'JetBrains Mono', monospace" font-size="10">• LangChain prompt orchestration</text>
    <text x="12" y="66" fill="#f4f0df" font-family="'JetBrains Mono', monospace" font-size="10">• Schema-grounded few-shots</text>
    <rect x="12" y="78" width="206" height="30" rx="4" fill="rgba(191, 242, 5, 0.1)" stroke="rgba(191, 242, 5, 0.3)" stroke-width="1" />
    <text x="18" y="94" fill="#bff205" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">READ-ONLY SQL GUARDRAIL: PASS</text>
    <text x="18" y="104" fill="#aaa28a" font-family="'JetBrains Mono', monospace" font-size="8">Blocked destructive tokens (DROP/ALTER/DELETE)</text>
  </g>

  <!-- CONNECTOR 2 -> 3 -->
  <path d="M 515 120 L 549 120" fill="none" stroke="#bff205" stroke-width="2" stroke-dasharray="3 3" />
  <polygon points="549,120 541,115 541,125" fill="#bff205" />

  <!-- STEP 3: POSTGRESQL ENGINE -->
  <g transform="translate(549, 60)">
    <rect width="215" height="120" rx="8" fill="#121816" stroke="rgba(0, 229, 255, 0.3)" stroke-width="1.2" />
    <rect x="0" y="0" width="215" height="28" rx="8" fill="rgba(0, 229, 255, 0.08)" />
    <text x="12" y="19" fill="#00e5ff" font-family="'Bricolage Grotesque', sans-serif" font-weight="700" font-size="12">3. PostgreSQL Execution</text>
    <text x="12" y="48" fill="#f4f0df" font-family="'JetBrains Mono', monospace" font-size="10">• 250,000+ UPI records indexed</text>
    <text x="12" y="66" fill="#f4f0df" font-family="'JetBrains Mono', monospace" font-size="10">• Execution time: 142ms</text>
    <text x="12" y="84" fill="#f4f0df" font-family="'JetBrains Mono', monospace" font-size="10">• Synthesizes business insights</text>
    <rect x="12" y="94" width="191" height="18" rx="3" fill="rgba(0, 229, 255, 0.12)" />
    <text x="107" y="106" fill="#00e5ff" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">IIT BOMBAY INSIGHTX RUNTIME</text>
  </g>

  <!-- INTERACTIVE CONSOLE / SQL OUTPUT (LOWER HALF) -->
  <g transform="translate(36, 200)">
    <rect width="728" height="205" rx="8" fill="#0a0e0c" stroke="rgba(244, 240, 223, 0.12)" stroke-width="1" />
    <!-- Console Tab Bar -->
    <rect x="0" y="0" width="728" height="32" rx="8" fill="#121614" />
    <text x="16" y="21" fill="#aaa28a" font-family="'JetBrains Mono', monospace" font-size="10">CANONICAL SCHEMA // transactions(id, amount, merchant, category, timestamp, status, latency_ms, upi_ref)</text>
    <rect x="630" y="6" width="85" height="20" rx="3" fill="rgba(191, 242, 5, 0.15)" />
    <text x="672" y="20" fill="#bff205" font-family="'JetBrains Mono', monospace" font-size="9.5" text-anchor="middle" font-weight="700">SQL VERIFIED</text>

    <!-- Query Text -->
    <text x="16" y="60" fill="#00e5ff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">GENERATED EXECUTABLE SQL:</text>
    <rect x="16" y="70" width="696" height="54" rx="4" fill="#050706" stroke="rgba(0, 229, 255, 0.15)" stroke-width="1" />
    <text x="26" y="90" fill="#f4f0df" font-family="'JetBrains Mono', monospace" font-size="10.5">SELECT category, COUNT(id) AS txn_count, SUM(amount) AS total_volume, AVG(latency_ms) AS avg_latency</text>
    <text x="26" y="110" fill="#bff205" font-family="'JetBrains Mono', monospace" font-size="10.5">FROM transactions WHERE status = 'SUCCESS' GROUP BY category ORDER BY total_volume DESC;</text>

    <!-- Synthetic Output Box -->
    <rect x="16" y="136" width="696" height="54" rx="4" fill="#111815" stroke="rgba(191, 242, 5, 0.2)" stroke-width="1" />
    <text x="26" y="154" fill="#00e5ff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">BUSINESS INSIGHT SYNTHESIS:</text>
    <text x="26" y="174" fill="#f4f0df" font-family="'Bricolage Grotesque', sans-serif" font-size="12">Electronics leads at ₹4.2M volume (84,210 txns, 114ms avg latency); failure rate dropped 1.8% week-over-week.</text>
  </g>

  <!-- Footer Metrics -->
  <g transform="translate(36, 420)">
    <rect width="728" height="38" rx="6" fill="rgba(244, 240, 223, 0.02)" stroke="rgba(244, 240, 223, 0.08)" stroke-width="1" />
    <text x="20" y="24" fill="#aaa28a" font-family="'JetBrains Mono', monospace" font-size="11">SCALE:</text>
    <text x="75" y="24" fill="#f4f0df" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">250,000+ UPI Records</text>
    <text x="260" y="24" fill="#aaa28a" font-family="'JetBrains Mono', monospace" font-size="11">AWARD:</text>
    <text x="320" y="24" fill="#bff205" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">2nd Position, IIT Bombay InsightX</text>
    <text x="580" y="24" fill="#aaa28a" font-family="'JetBrains Mono', monospace" font-size="11">COMPETITION:</text>
    <text x="675" y="24" fill="#00e5ff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">1,700+ Teams</text>
  </g>
</svg>

