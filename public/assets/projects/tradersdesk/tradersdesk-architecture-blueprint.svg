<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="td-grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e0b" />
      <stop offset="100%" stop-color="#121610" />
    </linearGradient>
    <linearGradient id="td-accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff5e3a" />
      <stop offset="100%" stop-color="#bff205" />
    </linearGradient>
    <pattern id="td-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(244, 240, 223, 0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="480" fill="url(#td-grad-bg)" rx="12" />
  <rect width="800" height="480" fill="url(#td-grid)" rx="12" />
  <rect width="798" height="478" x="1" y="1" fill="none" stroke="rgba(244, 240, 223, 0.1)" stroke-width="1" rx="11" />

  <!-- Window Header Bar -->
  <rect x="0" y="0" width="800" height="40" fill="rgba(244, 240, 223, 0.03)" rx="12" />
  <circle cx="24" cy="20" r="4.5" fill="#ff5e3a" opacity="0.8" />
  <circle cx="40" cy="20" r="4.5" fill="#e1b92f" opacity="0.8" />
  <circle cx="56" cy="20" r="4.5" fill="#bff205" opacity="0.8" />
  <text x="80" y="24" fill="#aaa28a" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="0.5">TRADERSDESK // LOCAL-FIRST LEDGER ARCHITECTURE v2.4</text>
  <rect x="620" y="10" width="160" height="20" rx="4" fill="rgba(191, 242, 5, 0.12)" stroke="rgba(191, 242, 5, 0.3)" stroke-width="1" />
  <text x="700" y="24" fill="#bff205" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle" font-weight="700">3 ACTIVE CLIENTS</text>

  <!-- Main System Diagram Layout -->
  <!-- NODE 1: DESKTOP CLIENT -->
  <g transform="translate(36, 68)">
    <rect width="210" height="150" rx="8" fill="#141712" stroke="rgba(255, 94, 58, 0.4)" stroke-width="1.2" />
    <rect x="0" y="0" width="210" height="32" rx="8" fill="rgba(255, 94, 58, 0.08)" />
    <text x="16" y="21" fill="#ff5e3a" font-family="'Bricolage Grotesque', sans-serif" font-weight="700" font-size="13">Desktop Billing UI</text>
    <text x="16" y="52" fill="#aaa28a" font-family="'JetBrains Mono', monospace" font-size="10">Stack: Java Swing · FlatLaf</text>
    <text x="16" y="72" fill="#f4f0df" font-family="'Bricolage Grotesque', sans-serif" font-size="12">• Keyboard-driven entry</text>
    <text x="16" y="92" fill="#f4f0df" font-family="'Bricolage Grotesque', sans-serif" font-size="12">• 5,000+ monthly trade lines</text>
    <text x="16" y="112" fill="#f4f0df" font-family="'Bricolage Grotesque', sans-serif" font-size="12">• Commission &amp; returns calc</text>
    <rect x="16" y="126" width="178" height="16" rx="3" fill="rgba(255, 94, 58, 0.12)" />
    <text x="105" y="138" fill="#ff5e3a" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">OFFICE BILLING WORKSTATION</text>
  </g>

  <!-- NODE 2: FLUTTER FIELD CLIENT -->
  <g transform="translate(36, 246)">
    <rect width="210" height="150" rx="8" fill="#141712" stroke="rgba(244, 240, 223, 0.15)" stroke-width="1.2" />
    <rect x="0" y="0" width="210" height="32" rx="8" fill="rgba(244, 240, 223, 0.04)" />
    <text x="16" y="21" fill="#f4f0df" font-family="'Bricolage Grotesque', sans-serif" font-weight="700" font-size="13">Flutter Mobile Companion</text>
    <text x="16" y="52" fill="#aaa28a" font-family="'JetBrains Mono', monospace" font-size="10">Stack: Flutter · SQLite (sqflite)</text>
    <text x="16" y="72" fill="#f4f0df" font-family="'Bricolage Grotesque', sans-serif" font-size="12">• On-the-field ledger lookup</text>
    <text x="16" y="92" fill="#f4f0df" font-family="'Bricolage Grotesque', sans-serif" font-size="12">• 2,000+ settlement txns</text>
    <text x="16" y="112" fill="#f4f0df" font-family="'Bricolage Grotesque', sans-serif" font-size="12">• Broker balance collection</text>
    <rect x="16" y="126" width="178" height="16" rx="3" fill="rgba(244, 240, 223, 0.08)" />
    <text x="105" y="138" fill="#aaa28a" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">MOBILE BROKER FIELD APP</text>
  </g>

  <!-- CONNECTOR PIPES: Clients -> Local DB -->
  <path d="M 246 143 L 306 143 L 306 200 L 336 200" fill="none" stroke="#ff5e3a" stroke-width="2" stroke-dasharray="4 4" />
  <path d="M 246 321 L 306 321 L 306 264 L 336 264" fill="none" stroke="#aaa28a" stroke-width="2" stroke-dasharray="4 4" />

  <!-- NODE 3: LOCAL PERSISTENCE CORE -->
  <g transform="translate(336, 140)">
    <rect width="210" height="184" rx="8" fill="#141712" stroke="#bff205" stroke-width="1.5" />
    <rect x="0" y="0" width="210" height="34" rx="8" fill="rgba(191, 242, 5, 0.12)" />
    <text x="16" y="22" fill="#bff205" font-family="'Bricolage Grotesque', sans-serif" font-weight="700" font-size="13">Local Persistence Core</text>
    <text x="16" y="54" fill="#aaa28a" font-family="'JetBrains Mono', monospace" font-size="10">SQLite Engine · Hibernate DAO</text>
    <text x="16" y="76" fill="#f4f0df" font-family="'Bricolage Grotesque', sans-serif" font-size="12">• Sub-millisecond reads/writes</text>
    <text x="16" y="96" fill="#f4f0df" font-family="'Bricolage Grotesque', sans-serif" font-size="12">• 100% network outage tolerance</text>
    <text x="16" y="116" fill="#f4f0df" font-family="'Bricolage Grotesque', sans-serif" font-size="12">• Monotonic mutation changelog</text>
    <text x="16" y="136" fill="#f4f0df" font-family="'Bricolage Grotesque', sans-serif" font-size="12">• Client ledger state integrity</text>
    <rect x="16" y="152" width="178" height="20" rx="3" fill="#bff205" fill-opacity="0.15" stroke="rgba(191, 242, 5, 0.4)" stroke-width="1" />
    <text x="105" y="166" fill="#bff205" font-family="'JetBrains Mono', monospace" font-size="9.5" text-anchor="middle" font-weight="700">LOCAL ACID · DELTA RECONCILIATION</text>
  </g>

  <!-- CONNECTOR PIPES: Local DB -> Cloud Store -->
  <path d="M 546 232 L 606 232" fill="none" stroke="#bff205" stroke-width="2.5" />
  <polygon points="606,232 596,226 596,238" fill="#bff205" />
  <text x="576" y="222" fill="#aaa28a" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">HTTPS SYNC</text>

  <!-- NODE 4: CLOUD REPLICA -->
  <g transform="translate(606, 140)">
    <rect width="160" height="184" rx="8" fill="#141712" stroke="rgba(0, 229, 255, 0.4)" stroke-width="1.2" />
    <rect x="0" y="0" width="160" height="34" rx="8" fill="rgba(0, 229, 255, 0.08)" />
    <text x="14" y="22" fill="#00e5ff" font-family="'Bricolage Grotesque', sans-serif" font-weight="700" font-size="13">Cloud Persistence</text>
    <text x="14" y="54" fill="#aaa28a" font-family="'JetBrains Mono', monospace" font-size="10">Supabase PostgreSQL</text>
    <text x="14" y="78" fill="#f4f0df" font-family="'Bricolage Grotesque', sans-serif" font-size="12">• Multi-device sync</text>
    <text x="14" y="100" fill="#f4f0df" font-family="'Bricolage Grotesque', sans-serif" font-size="12">• Remote archives</text>
    <text x="14" y="122" fill="#f4f0df" font-family="'Bricolage Grotesque', sans-serif" font-size="12">• Delta reconciliation</text>
    <rect x="14" y="152" width="132" height="20" rx="3" fill="rgba(0, 229, 255, 0.12)" />
    <text x="80" y="166" fill="#00e5ff" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">DURABLE CLUSTER</text>
  </g>

  <!-- Footer Stats Strip -->
  <g transform="translate(36, 420)">
    <rect width="730" height="38" rx="6" fill="rgba(244, 240, 223, 0.02)" stroke="rgba(244, 240, 223, 0.08)" stroke-width="1" />
    <text x="24" y="24" fill="#aaa28a" font-family="'JetBrains Mono', monospace" font-size="11">DEPLOYMENT:</text>
    <text x="110" y="24" fill="#f4f0df" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">3 Saree Brokerages, Pune</text>
    <text x="310" y="24" fill="#aaa28a" font-family="'JetBrains Mono', monospace" font-size="11">THROUGHPUT:</text>
    <text x="395" y="24" fill="#bff205" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">5,000+ Trade Records/Mo</text>
    <text x="560" y="24" fill="#aaa28a" font-family="'JetBrains Mono', monospace" font-size="11">SETTLEMENT:</text>
    <text x="645" y="24" fill="#ff5e3a" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">2,000+ Txns/Mo</text>
  </g>
</svg>

