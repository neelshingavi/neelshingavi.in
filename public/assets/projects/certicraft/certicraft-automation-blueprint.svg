  <rect width="798" height="478" x="1" y="1" fill="none" stroke="rgba(0, 166, 166, 0.3)" stroke-width="1" rx="11" />

  <!-- Header -->
  <rect x="0" y="0" width="800" height="40" fill="rgba(244, 240, 223, 0.03)" rx="12" />
  <circle cx="24" cy="20" r="4.5" fill="#ff5e3a" opacity="0.8" />
  <circle cx="40" cy="20" r="4.5" fill="#e1b92f" opacity="0.8" />
  <circle cx="56" cy="20" r="4.5" fill="#bff205" opacity="0.8" />
  <text x="80" y="24" fill="#aaa28a" font-family="'JetBrains Mono', monospace" font-size="11">CERTICRAFT // BATCH CERTIFICATE AUTOMATION &amp; CRYPTOGRAPHIC QR PIPELINE</text>
  <rect x="625" y="10" width="155" height="20" rx="4" fill="rgba(0, 166, 166, 0.15)" />
  <text x="702" y="24" fill="#00e5ff" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle" font-weight="700">1ST PLACE PICT ACM</text>

