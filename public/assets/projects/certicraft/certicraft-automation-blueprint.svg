<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="cc-grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1011" />
      <stop offset="100%" stop-color="#11191a" />
    </linearGradient>
    <pattern id="cc-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(244, 240, 223, 0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="800" height="480" fill="url(#cc-grad-bg)" rx="12" />
