    <text x="14" y="21" fill="#00e5ff" font-family="'Bricolage Grotesque', sans-serif" font-weight="700" font-size="13">1. Batch Ingestion</text>
    <text x="14" y="52" fill="#aaa28a" font-family="'JetBrains Mono', monospace" font-size="10">CSV / JSON Event Registrations</text>
    <text x="14" y="74" fill="#f4f0df" font-family="'Bricolage Grotesque', sans-serif" font-size="12">• 300+ participants automated</text>
    <text x="14" y="94" fill="#f4f0df" font-family="'Bricolage Grotesque', sans-serif" font-size="12">• Metadata normalization</text>
    <text x="14" y="114" fill="#f4f0df" font-family="'Bricolage Grotesque', sans-serif" font-size="12">• Dynamic template mapping</text>
    <rect x="14" y="126" width="182" height="16" rx="3" fill="rgba(0, 166, 166, 0.12)" />
    <text x="105" y="138" fill="#00e5ff" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">SCHEMA DATA NORMALIZER</text>
  </g>

  <path d="M 250 145 L 295 145" fill="none" stroke="#00e5ff" stroke-width="2" stroke-dasharray="3 3" />

  <g transform="translate(295, 70)">
    <rect width="210" height="150" rx="8" fill="#141c1e" stroke="rgba(191, 242, 5, 0.4)" stroke-width="1.2" />
    <rect x="0" y="0" width="210" height="32" rx="8" fill="rgba(191, 242, 5, 0.1)" />
    <text x="14" y="21" fill="#bff205" font-family="'Bricolage Grotesque', sans-serif" font-weight="700" font-size="13">2. Cryptographic QR Engine</text>
