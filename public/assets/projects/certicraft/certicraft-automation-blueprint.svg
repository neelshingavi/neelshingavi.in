  <!-- Technical Spec Lower Panel -->
  <g transform="translate(40, 240)">
    <rect width="720" height="160" rx="8" fill="#0c1214" stroke="rgba(244, 240, 223, 0.1)" stroke-width="1" />
    <rect x="0" y="0" width="720" height="32" rx="8" fill="#121a1c" />
    <text x="16" y="21" fill="#aaa28a" font-family="'JetBrains Mono', monospace" font-size="10">VERIFICATION TIMELINE // TECHSPRINT'26 HACKATHON WINNER (PICT ACM)</text>
    <text x="20" y="60" fill="#00e5ff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">CRYPTOGRAPHIC CREDENTIAL AUDITING:</text>
    <text x="20" y="84" fill="#f4f0df" font-family="'JetBrains Mono', monospace" font-size="10.5">• System computes hash H = SHA256(event_id + participant_id + issue_timestamp + secret_salt).</text>
    <text x="20" y="104" fill="#f4f0df" font-family="'JetBrains Mono', monospace" font-size="10.5">• Embeds verification URL inside QR code rendered directly onto PDF canvas via headless rendering.</text>
    <text x="20" y="124" fill="#bff205" font-family="'JetBrains Mono', monospace" font-size="10.5">• Any altered pixel or participant name immediately invalidates hash signature on public verification portal.</text>
  </g>

  <!-- Footer -->
  <g transform="translate(40, 420)">
    <rect width="720" height="38" rx="6" fill="rgba(244, 240, 223, 0.02)" stroke="rgba(244, 240, 223, 0.08)" stroke-width="1" />
    <text x="20" y="24" fill="#aaa28a" font-family="'JetBrains Mono', monospace" font-size="11">AWARD:</text>
    <text x="75" y="24" fill="#00e5ff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">1st Position Winner, TechSprint'26</text>
    <text x="360" y="24" fill="#aaa28a" font-family="'JetBrains Mono', monospace" font-size="11">COMPETITION:</text>
    <text x="460" y="24" fill="#bff205" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">250+ Teams Evaluated</text>
  </g>
