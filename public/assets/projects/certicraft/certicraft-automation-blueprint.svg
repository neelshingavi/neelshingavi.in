    <text x="14" y="74" fill="#f4f0df" font-family="'Bricolage Grotesque', sans-serif" font-size="12">• Dynamic tamper-proof QR</text>
    <text x="14" y="94" fill="#f4f0df" font-family="'Bricolage Grotesque', sans-serif" font-size="12">• Registry endpoint lookup</text>
    <text x="14" y="114" fill="#f4f0df" font-family="'Bricolage Grotesque', sans-serif" font-size="12">• Canvas rendering in vector</text>
    <rect x="14" y="126" width="182" height="16" rx="3" fill="rgba(191, 242, 5, 0.12)" />
    <text x="105" y="138" fill="#bff205" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">TAMPER-PROOF VERIFICATION</text>
  </g>

  <path d="M 505 145 L 550 145" fill="none" stroke="#bff205" stroke-width="2" stroke-dasharray="3 3" />

  <g transform="translate(550, 70)">
    <rect width="210" height="150" rx="8" fill="#141c1e" stroke="rgba(255, 94, 58, 0.4)" stroke-width="1.2" />
    <rect x="0" y="0" width="210" height="32" rx="8" fill="rgba(255, 94, 58, 0.1)" />
    <text x="14" y="21" fill="#ff5e3a" font-family="'Bricolage Grotesque', sans-serif" font-weight="700" font-size="13">3. Dispatch Pipeline</text>
    <text x="14" y="52" fill="#aaa28a" font-family="'JetBrains Mono', monospace" font-size="10">Automated Email Queues</text>
    <text x="14" y="74" fill="#f4f0df" font-family="'Bricolage Grotesque', sans-serif" font-size="12">• Bulk PDF generation</text>
    <text x="14" y="94" fill="#f4f0df" font-family="'Bricolage Grotesque', sans-serif" font-size="12">• Rate-limited email queues</text>
    <text x="14" y="114" fill="#f4f0df" font-family="'Bricolage Grotesque', sans-serif" font-size="12">• 80% manual effort saved</text>
    <rect x="14" y="126" width="182" height="16" rx="3" fill="rgba(255, 94, 58, 0.12)" />
    <text x="105" y="138" fill="#ff5e3a" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">ASYNCHRONOUS BATCH DISPATCH</text>
